name: build

# Compila, firma y publica el APK en el repo privado de APK (Release con tag fijo "peli-apk").
on:
  push:
    branches: [main, ccr-a586c547-cc7hgn]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_PUBLISH_TOKEN: ${{ secrets.APK_PUBLISH_TOKEN }}
      APK_REPO: ${{ secrets.APK_REPO }}
      APK_READ_TOKEN: ${{ secrets.APK_READ_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: sdk licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/k.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/k.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      # Sin llave fija cada build se firma distinto y Android no instala la actualización encima.
      - name: exigir firma estable
        run: |
          if [ -z "${KEYSTORE_FILE:-}" ]; then
            echo "::error::Falta el secreto KEYSTORE_B64 (con KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD): sin llave fija las actualizaciones no se pueden instalar."
            exit 1
          fi

      - name: assemble
        run: gradle assembleRelease --stacktrace

      - name: files
        run: |
          cp app/build/outputs/apk/release/app-release.apk Peli.apk
          grep -m1 'val appVersion' app/build.gradle.kts \
            | sed -E 's/.*"([0-9.]+)".*/\1/' > version.txt
          echo "VERSION=$(cat version.txt)" >> "$GITHUB_ENV"

      # Release en ESTE repo, uno por versión (v1.0.1…): APK directo y version.txt para la auto-actualización.
      # Enlace fijo al más nuevo:
      # https://github.com/<dueño>/peli/releases/latest/download/Peli.apk
      - name: release en este repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Peli ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            Peli.apk
            version.txt

      - name: publish
        if: ${{ env.APK_PUBLISH_TOKEN != '' && env.APK_REPO != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.APK_REPO }}
          token: ${{ env.APK_PUBLISH_TOKEN }}
          tag_name: peli-apk
          name: build
          files: |
            Peli.apk
            version.txt
