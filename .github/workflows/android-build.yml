name: build

# Compila, firma y publica el APK en el repo privado de APK (Release con tag fijo "peli-apk").
on:
  push:
    branches: [main, ccr-a586c547-cc7hgn]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_PUBLISH_TOKEN: ${{ secrets.APK_PUBLISH_TOKEN }}
      APK_REPO: ${{ secrets.APK_REPO }}
      APK_READ_TOKEN: ${{ secrets.APK_READ_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: sdk licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/k.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/k.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: assemble
        run: gradle assembleRelease --stacktrace

      - name: files
        run: |
          cp app/build/outputs/apk/release/app-release.apk Peli.apk
          grep -m1 'versionName' app/build.gradle.kts \
            | sed -E 's/.*"([0-9.]+)".*/\1/' > version.txt

      - name: guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Peli-apk
          path: |
            Peli.apk
            version.txt

      - name: publish
        if: ${{ env.APK_PUBLISH_TOKEN != '' && env.APK_REPO != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.APK_REPO }}
          token: ${{ env.APK_PUBLISH_TOKEN }}
          tag_name: peli-apk
          name: build
          files: |
            Peli.apk
            version.txt
